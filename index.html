<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Emic Wave</title>
  <style>
    :root {
      --bg: #0b1020;
      --fg: #f4f6fb;
      --muted: #9aa3b5;
      --card: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #6ea8fe;
      --accent-2: #a78bfa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: var(--fg);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(110, 168, 254, 0.22), transparent 60%),
        radial-gradient(900px 500px at 90% 0%, rgba(167, 139, 250, 0.18), transparent 55%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .shell {
      width: min(720px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 40px;
      backdrop-filter: blur(12px);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.1;
      font-weight: 700;
    }

    p {
      margin: 0 auto 32px;
      max-width: 42ch;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    button {
      appearance: none;
      border: 1px solid transparent;
      border-radius: 14px;
      padding: 14px 22px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
      min-width: 160px;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    .primary {
      color: #081018;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }

    .secondary {
      color: var(--fg);
      background: transparent;
      border-color: var(--border);
    }

    .secondary:hover {
      border-color: rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.04);
    }

    .note {
      margin-top: 28px;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="badge">Coming soon</div>
    <h1>Emic Wave</h1>
    <p>A clean landing page with room to grow. The buttons below are placeholders for future features.</p>
    <div class="actions">
      <button class="primary" type="button" id="btn-a" aria-label="Primary action placeholder">Button A</button>
      <button class="secondary" type="button" id="btn-b" aria-label="Secondary action placeholder">Button B</button>
    </div>
    <p class="note">Functions will be wired in later.</p>
  </main>
  <script>
    // Intentionally empty for now — wire handlers when features are ready.
    document.getElementById('btn-a').addEventListener('click', () => {});
    document.getElementById('btn-b').addEventListener('click', () => {});
  </script>
</body>
</html>
