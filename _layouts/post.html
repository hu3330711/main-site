---
layout: default
---
<article class="post">
  <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time></p>
  <h1>{{ page.title }}</h1>
  <div class="body">
    {{ content }}
  </div>
  <p class="back"><a href="{{ '/' | relative_url }}">← 全部文章</a></p>
</article>
